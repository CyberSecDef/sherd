#
# Enforce the Developer Certificate of Origin on every commit in a pull request
# (LEG-007). See CONTRIBUTING.md section 2.

name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  signoff:
    name: Check sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request commits
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Every commit must carry a Signed-off-by trailer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          commits=$(git rev-list "$BASE_SHA".."$HEAD_SHA")

          if [ -z "$commits" ]; then
            echo "No commits to check."
            exit 0
          fi

          for sha in $commits; do
            subject=$(git log -1 --format=%s "$sha")

            # Merge commits are generated by GitHub and carry no sign-off.
            if [ "$(git rev-list --parents -n 1 "$sha" | wc -w)" -gt 2 ]; then
              echo "skip   $(git rev-parse --short "$sha")  (merge commit) $subject"
              continue
            fi

            if git log -1 --format=%B "$sha" | grep -qE '^[[:space:]]*Signed-off-by: .+ <.+@.+>'; then
              echo "ok     $(git rev-parse --short "$sha")  $subject"
            else
              echo "FAIL   $(git rev-parse --short "$sha")  $subject"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            cat <<'MSG'

          ✗ One or more commits are missing a Signed-off-by trailer.

          Granite requires a Developer Certificate of Origin sign-off on every
          commit (LEG-007). To fix your branch:

              git rebase --signoff main
              git push --force-with-lease

          Install the local hook to catch this before pushing:

              make hooks

          See CONTRIBUTING.md section 2.
          MSG
            exit 1
          fi

          echo
          echo "✓ All commits signed off."
