# Copyright (C) 2026 The Sherd Authors
#
# Sherd's quality gates (QA-011, LEG-005, NFR-SEC-001, NFR-SEC-009,
# NFR-PLAT-001, NFR-PLAT-002, ARC-MOD-002, FR-MOB-001).
#
# The Go toolchain is pinned so builds are reproducible over time. A separate
# job builds against the go.mod floor so that floor stays honest rather than
# becoming a comfortable fiction.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.0'
  GO_FLOOR_VERSION: '1.23'
  # No CGO in the core (NFR-PLAT-002). Any CGO path must sit behind a build tag
  # with a pure-Go fallback, and must not be the default.
  CGO_ENABLED: '0'

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: Lint and policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install tooling
        run: make tools

      # Every policy step below runs even if an earlier one failed, so a
      # contributor sees all violations at once instead of discovering them one
      # CI round-trip at a time. The job still fails; it just reports fully.

      - name: gofumpt (QA-011)
        if: ${{ !cancelled() }}
        run: make fmt-check

      - name: go vet
        if: ${{ !cancelled() }}
        run: make vet

      - name: staticcheck (QA-011)
        if: ${{ !cancelled() }}
        run: make lint

      - name: gosec (QA-011)
        if: ${{ !cancelled() }}
        run: make sec

      - name: SPDX headers present
        if: ${{ !cancelled() }}
        run: make spdx-check

      - name: Architecture rules (ARC-MOD-001, ARC-MOD-002)
        if: ${{ !cancelled() }}
        run: make arch

      - name: No direct filesystem writes outside internal/vault (ARC-MOD-003)
        if: ${{ !cancelled() }}
        run: make vault-writes

      - name: No analytics or telemetry (NFR-SEC-001)
        if: ${{ !cancelled() }}
        run: make analytics

      - name: Dependency licenses are GPL-3.0-compatible (LEG-005, LEG-006)
        if: ${{ !cancelled() }}
        run: make licenses-check

      - name: Coverage floors (QA-001)
        if: ${{ !cancelled() }}
        run: make cover

      - name: Guards actually fire against known-bad fixtures
        if: ${{ !cancelled() }}
        run: make self-test

  # ---------------------------------------------------------------------------
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Test with the race detector (QA-005)
        # The race detector needs cgo, so it is enabled for this step only.
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...

  # ---------------------------------------------------------------------------
  floor:
    name: Build at the go.mod floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_FLOOR_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: The declared minimum Go version must actually work
        run: |
          go version
          go build ./...
          go test ./...

  # ---------------------------------------------------------------------------
  cross:
    name: Cross-compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux/arm64,   goos: linux,   goarch: arm64 }
          - { target: darwin/amd64,  goos: darwin,  goarch: amd64 }
          - { target: windows/arm64, goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build for ${{ matrix.target }} (NFR-PLAT-001)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath ./...

  # ---------------------------------------------------------------------------
  musl:
    name: Static binary runs under musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build a static linux/amd64 binary
        run: go build -trimpath -o sherd-static ./cmd/sherd

      - name: It must be statically linked
        run: |
          file sherd-static
          if ldd sherd-static 2>&1 | grep -qv 'not a dynamic executable'; then
            echo "✗ binary is dynamically linked; CGO leaked into the build (NFR-PLAT-002)" >&2
            ldd sherd-static || true
            exit 1
          fi
          echo "✓ statically linked"

      - name: It must run on musl (Alpine), not only glibc (NFR-PLAT-001)
        run: |
          # The stub exits 1 by design, so assert on its output, not its status.
          out=$(docker run --rm -v "$PWD/sherd-static:/sherd-static:ro" \
                  alpine:latest /sherd-static 2>&1 || true)
          echo "$out"
          case "$out" in
            *"not implemented"*) echo "✓ ran under musl" ;;
            *) echo "✗ binary did not run under musl" >&2; exit 1 ;;
          esac

  # ---------------------------------------------------------------------------
  mobile:
    name: Mobile compile guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Core must compile for android/arm64 and ios/arm64 (FR-MOB-001)
        run: |
          # Library packages only. Linking a main package for ios requires cgo
          # and an Apple toolchain, and an iOS app embeds an archive rather than
          # running a standalone binary — so compiling the core is the check
          # that carries meaning here.
          for target in android/arm64 ios/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            echo "==> $GOOS/$GOARCH"
            go build ./internal/... ./pkg/...
          done
          echo "✓ core compiles for both mobile targets"

      - name: Warn if a desktop-only dependency has crept into the core
        run: |
          echo "If the step above failed, do not add a build tag to route around"
          echo "it. A desktop-only dependency in the core is how the mobile path"
          echo "dies quietly (X.4.2)."

  # ---------------------------------------------------------------------------
  # A minute per target is a smoke test, not the requirement. FR-MD-005 asks
  # for 24 hours clean, which the nightly workflow accumulates; this job exists
  # so a pull request that reintroduces a known crasher fails on the seed
  # corpus before anyone waits for the night.
  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: Parser (FR-MD-005)
        run: go test ./pkg/format/markdown/ -run '^$' -fuzz FuzzParse -fuzztime 60s
      - name: Incremental reparse (FR-MD-004)
        run: go test ./pkg/format/markdown/ -run '^$' -fuzz FuzzReparse -fuzztime 60s
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: pkg/format/markdown/testdata/fuzz/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - name: govulncheck (NFR-SEC-009)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  # ---------------------------------------------------------------------------
  reproducible:
    name: Build is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: The same source must produce the same bytes (NFR-PLAT-002)
        run: |
          build() {
            go build -trimpath -buildvcs=false -ldflags='-buildid=' \
              -o "$1" ./cmd/sherdd
          }
          build a.bin
          build b.bin
          ha=$(sha256sum a.bin | cut -d' ' -f1)
          hb=$(sha256sum b.bin | cut -d' ' -f1)
          echo "build 1: $ha"
          echo "build 2: $hb"
          if [ "$ha" != "$hb" ]; then
            echo "✗ build is not reproducible" >&2
            exit 1
          fi
          echo "✓ reproducible"
