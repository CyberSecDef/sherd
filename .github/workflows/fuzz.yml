#
# Nightly fuzzing (FR-MD-005).
#
# The requirement is 24 hours of fuzzing with zero crashes, which no pull
# request can afford to wait for. This workflow accumulates it instead: two
# hours per target per night, so the figure is reached over roughly a week and
# then keeps going, which is the more useful property anyway — the parser keeps
# changing, and a one-time 24 hours would say nothing about the version that
# ships.
#
# A failure here is a real defect. The input that caused it is uploaded so it
# can be committed as a seed, where it stays a permanent regression test.

name: Fuzz

on:
  schedule:
    # 03:00 UTC, outside the working day in the maintainer's timezone.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes per fuzz target'
        required: false
        default: '120'

permissions:
  contents: read

env:
  GO_VERSION: '1.27.0'
  CGO_ENABLED: '0'

jobs:
  fuzz:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: markdown/FuzzParse
            pkg: ./pkg/format/markdown/
            target: FuzzParse
          - name: markdown/FuzzReparse
            pkg: ./pkg/format/markdown/
            target: FuzzReparse
          - name: frontmatter/FuzzParse
            pkg: ./pkg/format/frontmatter/
            target: FuzzParse
          - name: frontmatter/FuzzExtent
            pkg: ./pkg/format/frontmatter/
            target: FuzzExtent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Fuzz ${{ matrix.name }}
        run: |
          minutes="${{ github.event.inputs.minutes || '120' }}"
          echo "fuzzing ${{ matrix.name }} for ${minutes}m"
          go test ${{ matrix.pkg }} -run '^$' \
            -fuzz '^${{ matrix.target }}$' -fuzztime "${minutes}m" -timeout 0

      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure-${{ matrix.target }}-${{ strategy.job-index }}
          path: ${{ matrix.pkg }}testdata/fuzz/
          if-no-files-found: ignore
