#
# Architecture rules for Granite (ARC-MOD-001, ARC-MOD-002, ARC-MOD-003).
# Checked in CI by go-arch-lint. See REQUIREMENT_SPEC.md section 4.3.
#
# The rule that matters most here: pkg/ is Granite's public API surface and
# must never import internal/. pkg/format in particular is meant to be usable
# as a standalone library by anyone (ARC-MOD-001).

version: 3
workdir: .

allow:
  depOnAnyVendor: false

components:
  # ---- Public API. Must not import internal/. ----
  format:      { in: pkg/format/** }
  pluginsdk:   { in: pkg/pluginsdk/** }

  # ---- Binaries. May wire anything together. ----
  cmd:         { in: cmd/** }

  # ---- Implementation packages. ----
  vault:       { in: internal/vault/** }
  mdast:       { in: internal/mdast/** }
  index:       { in: internal/index/** }
  graph:       { in: internal/graph/** }
  query:       { in: internal/query/** }
  bases:       { in: internal/bases/** }
  canvas:      { in: internal/canvas/** }
  workspace:   { in: internal/workspace/** }
  command:     { in: internal/command/** }
  plugin:      { in: internal/plugin/** }
  sync:        { in: internal/sync/** }
  publish:     { in: internal/publish/** }
  rpc:         { in: internal/rpc/** }
  config:      { in: internal/config/** }

deps:
  # ARC-MOD-001: the public packages depend on nothing inside this project.
  # An empty mayDependOn is the point, not an oversight.
  format:
    # May use third-party libraries, but no component of this project.
    anyVendorDeps: true
  pluginsdk:
    anyVendorDeps: true

  # Binaries wire the application together, so they may reach anywhere.
  cmd:
    mayDependOn:
      - format
      - pluginsdk
      - vault
      - mdast
      - index
      - graph
      - query
      - bases
      - canvas
      - workspace
      - command
      - plugin
      - sync
      - publish
      - rpc
      - config

  # Layering below. These grants are deliberately narrow: widen one only with a
  # reason in the pull request, because every widening makes the graph harder to
  # reason about and brings an import cycle closer (ARC-MOD-002).
  #
  # ARC-MOD-003: internal/vault is the only package that writes user data. That
  # rule is about filesystem calls rather than imports, so it is enforced
  # separately by scripts/check-vault-writes.sh.

  vault:
    mayDependOn: [format, config]
  mdast:
    mayDependOn: [format]
  index:
    mayDependOn: [format, mdast, vault, config]
  graph:
    mayDependOn: [format, index]
  query:
    mayDependOn: [format, index, mdast]
  bases:
    mayDependOn: [format, index, query, vault]
  canvas:
    mayDependOn: [format, vault]
  workspace:
    mayDependOn: [config]
  command:
    mayDependOn: [config]
  plugin:
    mayDependOn: [format, pluginsdk, vault, index, query, command, config]
  sync:
    mayDependOn: [format, vault, index, config]
  publish:
    mayDependOn: [format, mdast, index, query, vault, config]
  rpc:
    mayDependOn:
      - format
      - vault
      - mdast
      - index
      - graph
      - query
      - bases
      - canvas
      - workspace
      - command
      - plugin
      - sync
      - publish
      - config
  config:
    anyVendorDeps: true

commonComponents:
  - format
